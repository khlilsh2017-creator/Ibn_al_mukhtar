<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | متجر تراث اليمن</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --yemen-red: #8B0000;
            --honey-gold: #D4AF37;
            --dark-coffee: #2C1810;
            --cream: #FFFDF9;
            --success-green: #25D366;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--cream);
            color: var(--dark-coffee);
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .header-main {
            background: white;
            border-bottom: 3px solid var(--honey-gold);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .brand-text {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--yemen-red);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--yemen-red);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
            z-index: 1050;
        }

        .nav-item {
            text-align: center;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            position: relative;
            background: none;
            border: none;
            flex: 1;
        }

        .nav-item.active { color: var(--yemen-red); }
        .nav-item i { font-size: 1.4rem; display: block; }

        .whatsapp-btn {
            background: var(--success-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .product-image-main {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 3px solid var(--honey-gold);
        }

        .thumbnail-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .thumbnail.active {
            border-color: var(--yemen-red);
            transform: scale(1.05);
        }

        .product-title {
            color: var(--dark-coffee);
            font-weight: 900;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--honey-gold);
            padding-bottom: 10px;
        }

        .price-tag {
            background: var(--yemen-red);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.5rem;
            display: inline-block;
            margin-bottom: 20px;
        }

        .description-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border-right: 5px solid var(--honey-gold);
            margin: 20px 0;
            box-shadow: var(--shadow-sm);
        }

        .btn-add-cart-detail {
            background: var(--dark-coffee);
            color: var(--honey-gold);
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            transition: 0.3s;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-add-cart-detail:active {
            background: var(--yemen-red);
            color: white;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--dark-coffee);
            font-size: 1.2rem;
        }

        .specs-list {
            list-style: none;
            padding: 0;
        }

        .specs-list li {
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }

        .specs-list li:last-child {
            border-bottom: none;
        }

        .specs-list i {
            color: var(--honey-gold);
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header class="header-main">
        <div class="container d-flex justify-content-between align-items-center">
            <button class="back-btn" onclick="goBack()">
                <i class="fas fa-arrow-right"></i>
            </button>
            <div class="brand-text">◈ تفاصيل المنتج ◈</div>
            <div class="d-flex gap-3">
                <div class="position-relative">
                    <i class="fas fa-shopping-bag fa-lg" onclick="goToCart()"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <div id="product-details">
            <!-- سيتم ملؤها بـ JavaScript -->
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="goHome()">
            <i class="fas fa-home"></i> الرئيسية
        </button>
        <button class="nav-item" onclick="goToCart()">
            <div class="position-relative d-inline-block">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cart-count-bottom">0</span>
            </div>
            السلة
        </button>
    </nav>

    <script>
        // بيانات المنتجات من localStorage
        let dbProducts = JSON.parse(localStorage.getItem('yemen_v3_data')) || [];
        let cart = JSON.parse(localStorage.getItem('yemen_cart')) || [];
        
        // تحديث عداد السلة
        function updateCartBadge() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-count-bottom').innerText = count;
        }
        
        // الرجوع للصفحة السابقة
        function goBack() {
            window.history.back();
        }
        
        // الذهاب للصفحة الرئيسية
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // الذهاب للسلة
        function goToCart() {
            window.location.href = 'index.html';
            // في index.html سنضيف كود للانتقال المباشر لصفحة السلة
            localStorage.setItem('gotoCart', 'true');
        }
        
        // عرض تفاصيل المنتج
        function renderProductDetails() {
            const productId = parseInt(localStorage.getItem('currentProductId'));
            const product = dbProducts.find(p => p.id === productId);
            const container = document.getElementById('product-details');
            
            if (!product) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-box-open fa-4x text-muted mb-3"></i>
                        <h4>المنتج غير موجود</h4>
                        <button class="btn btn-outline-danger mt-3" onclick="goHome()">العودة للمنتجات</button>
                    </div>
                `;
                return;
            }
            
            // التحقق إذا المنتج في السلة
            const inCart = cart.find(item => item.id === productId);
            const qtyInCart = inCart ? inCart.qty : 0;
            
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="sticky-top" style="top: 100px">
                            <img id="main-image" src="${product.images[0]}" class="product-image-main" 
                                 onerror="this.src='https://via.placeholder.com/300x300'">
                            
                            <div class="thumbnail-container">
                                ${product.images.map((img, index) => `
                                    <img src="${img}" class="thumbnail ${index === 0 ? 'active' : ''}" 
                                         onclick="changeMainImage('${img}', this)"
                                         onerror="this.src='https://via.placeholder.com/80x80'">
                                `).join('')}
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="text-muted">
                                    <i class="fas fa-tag me-1"></i> ${product.cat || 'منتجات يمنية'}
                                </span>
                                <span class="text-muted">
                                    <i class="fas fa-eye me-1"></i> متوفر
                                </span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <h1 class="product-title">${product.name}</h1>
                        
                        <div class="price-tag">
                            ${Number(product.price).toLocaleString()} ريال
                        </div>
                        
                        ${qtyInCart > 0 ? `
                        <div class="alert alert-success d-flex align-items-center" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <div>
                                موجود في سلة المشتريات (${qtyInCart} قطعة)
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="description-box">
                            <h5><i class="fas fa-file-alt me-2"></i>وصف المنتج</h5>
                            <p class="mt-3">${product.desc || 'منتج يمني أصيل بجودة عالية، مصنوع يدوياً بأيدي حرفيين يمنيين مهرة، يعكس التراث اليمني الأصيل والجودة المتميزة.'}</p>
                        </div>
                        
                        <div class="description-box">
                            <h5><i class="fas fa-list-check me-2"></i>مواصفات المنتج</h5>
                            <ul class="specs-list mt-3">
                                <li><i class="fas fa-check"></i> أصلي 100% من اليمن</li>
                                <li><i class="fas fa-check"></i> جودة عالية</li>
                                <li><i class="fas fa-check"></i> ضمان الجودة</li>
                                <li><i class="fas fa-check"></i> توصيل سريع</li>
                                <li><i class="fas fa-check"></i> دعم فني على مدار الساعة</li>
                            </ul>
                        </div>
                        
                        <button class="btn-add-cart-detail" onclick="addToCart(${product.id})">
                            <i class="fas fa-plus-circle"></i> إضافة إلى السلة
                        </button>
                        
                        <a href="#" class="whatsapp-btn mt-3" onclick="orderSingleProduct(${product.id})">
                            <i class="fab fa-whatsapp"></i> طلب عبر واتساب
                        </a>
                    </div>
                </div>
            `;
        }
        
        // تغيير الصورة الرئيسية
        function changeMainImage(src, element) {
            document.getElementById('main-image').src = src;
            document.querySelectorAll('.thumbnail').forEach(thumb => thumb.classList.remove('active'));
            element.classList.add('active');
        }
        
        // إضافة المنتج للسلة
        function addToCart(id) {
            const product = dbProducts.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);
            
            if (inCart) {
                inCart.qty++;
            } else {
                cart.push({...product, qty: 1});
            }
            
            // حفظ السلة في localStorage
            localStorage.setItem('yemen_cart', JSON.stringify(cart));
            
            updateCartBadge();
            
            // تأثير بصري
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> تم الإضافة بنجاح';
            btn.style.background = 'var(--yemen-red)';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
            }, 2000);
            
            // إعادة عرض التفاصيل للتحديث
            setTimeout(renderProductDetails, 100);
        }
        
        // طلب منتج واحد عبر واتساب
        function orderSingleProduct(productId) {
            const product = dbProducts.find(p => p.id === productId);
            const phone = "967777318938";
            
            let message = `📦 *طلب منتج من متجر تراث اليمن*\n\n`;
            message += `*المنتج:* ${product.name}\n`;
            message += `*السعر:* ${product.price} ريال\n`;
            message += `*الفئة:* ${product.cat || 'منتجات يمنية'}\n\n`;
            message += `يرجى التواصل لتأكيد الطلب والكمية المطلوبة.`;
            
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
        
        // تهيئة الصفحة
        window.onload = () => {
            updateCartBadge();
            renderProductDetails();
        };
    </script>
</body>
</html>
