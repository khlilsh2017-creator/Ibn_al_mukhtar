<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تراث اليمن | تجربة تسوق متكاملة</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --yemen-red: #8B0000;
            --honey-gold: #D4AF37;
            --dark-coffee: #2C1810;
            --cream: #FFFDF9;
            --success-green: #25D366;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--cream);
            color: var(--dark-coffee);
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 80px; /* لمساحة القائمة السفلية */
        }

        /* --- شاشة الترحيب --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--dark-coffee);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--honey-gold);
        }

        /* --- الهيدر --- */
        .header-main {
            background: white;
            border-bottom: 3px solid var(--honey-gold);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .brand-text {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--yemen-red);
        }

        /* --- المنتجات --- */
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eee;
            margin-bottom: 20px;
            transition: 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .product-img-wrapper {
            position: relative;
            height: 180px;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .product-card:hover .product-img {
            transform: scale(1.1);
        }

        .price-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--yemen-red);
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn-add-cart {
            background: var(--dark-coffee);
            color: var(--honey-gold);
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-add-cart:active {
            background: var(--yemen-red);
            color: white;
        }

        /* --- السلة --- */
        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--yemen-red);
            color: white;
            font-size: 0.7rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- القائمة السفلية --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
            z-index: 1050;
        }

        .nav-item {
            text-align: center;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            position: relative;
            background: none;
            border: none;
            flex: 1;
        }

        .nav-item.active { color: var(--yemen-red); }
        .nav-item i { font-size: 1.4rem; display: block; }

        /* --- الصفحات --- */
        .app-page { display: none; padding: 20px 0; }
        .active-page { display: block; animation: fadeIn 0.4s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .category-pill {
            padding: 8px 20px;
            border-radius: 50px;
            background: white;
            border: 1px solid #ddd;
            display: inline-block;
            margin: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .category-pill.active {
            background: var(--yemen-red);
            color: white;
            border-color: var(--yemen-red);
        }

        .whatsapp-btn {
            background: var(--success-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            width: 100%;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--dark-coffee);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <i class="fas fa-mosque fa-4x mb-3 animate__animated animate__pulse animate__infinite"></i>
        <h2 class="fw-bold">متجر تراث اليمن</h2>
        <div class="spinner-border text-warning mt-3" role="status"></div>
    </div>

    <header class="header-main">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="brand-text">◈ تُراث اليَمن ◈</div>
            <div class="d-flex gap-3">
                <i class="fas fa-search fa-lg" onclick="toggleSearch()"></i>
            </div>
        </div>
    </header>

    <div id="search-bar" class="container mt-3" style="display: none;">
        <input type="text" id="inp-search" class="form-control rounded-pill border-warning" placeholder="ابحث عن عسل، جنابي، بن..." onkeyup="searchProducts(this.value)">
    </div>

    <main id="page-home" class="app-page active-page">
        <div class="container">
            <div class="overflow-auto d-flex pb-3 mb-4 no-scrollbar">
                <div class="category-pill active" onclick="filterCat('الكل', this)">الكل</div>
                <div class="category-pill" onclick="filterCat('عسل طبيعي', this)">عسل طبيعي</div>
                <div class="category-pill" onclick="filterCat('جنابي وأحزمة', this)">جنابي</div>
                <div class="category-pill" onclick="filterCat('بن وقشر', this)">البن اليمني</div>
                <div class="category-pill" onclick="filterCat('فضيات يمنية', this)">الفضيات</div>
            </div>

            <div class="row g-3" id="products-grid">
                <!-- سيتم ملؤها بالمنتجات -->
            </div>
        </div>
    </main>

    <div id="page-cart" class="app-page">
        <div class="container">
            <button class="btn btn-outline-secondary mb-3" onclick="showPage('home')">
                <i class="fas fa-arrow-right"></i> العودة للمنتجات
            </button>
            <h3 class="fw-bold mb-4"><i class="fas fa-shopping-basket text-danger me-2"></i>سلة المشتريات</h3>
            <div id="cart-items">
                <!-- سيتم ملؤها بمنتجات السلة -->
            </div>
            
            <div id="cart-empty" class="text-center py-5">
                <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
                <p>سلتك فارغة حالياً.. املأها بكنوز اليمن!</p>
                <button class="btn btn-outline-danger rounded-pill" onclick="showPage('home')">ابدأ التسوق</button>
            </div>

            <div id="cart-summary" class="mt-4" style="display: none;">
                <div class="bg-white p-3 rounded-4 shadow-sm">
                    <div class="d-flex justify-content-between mb-2">
                        <span>إجمالي المنتجات:</span>
                        <span id="sum-price">0 ريال</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>التوصيل:</span>
                        <span class="text-success">مجاني</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold mb-3">
                        <span>المجموع النهائي:</span>
                        <span id="final-price" class="text-danger">0 ريال</span>
                    </div>
                    <a href="#" class="whatsapp-btn" onclick="sendOrderWhatsApp()">
                        <i class="fab fa-whatsapp"></i> تأكيد الطلب عبر واتساب
                    </a>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="btn-home" onclick="showPage('home')">
            <i class="fas fa-home"></i> الرئيسية
        </button>
        <button class="nav-item" id="btn-cart" onclick="showPage('cart')">
            <div class="position-relative d-inline-block">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </div>
            السلة
        </button>
    </nav>

    <script>
        /**
         * محرك تشغيل متجر تراث اليمن - نسخة الزبون
         */

        // 1. البيانات (جلب المنتجات المضافة من لوحة الإدارة)
        let dbProducts = JSON.parse(localStorage.getItem('yemen_v3_data')) || [];
        let cart = JSON.parse(localStorage.getItem('yemen_cart')) || [];

        // 2. عند التحميل
        window.onload = () => {
            // إخفاء الـ Splash بعد ثانيتين
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                renderProducts(dbProducts);
                updateCartBadge();
                
                // التحقق إذا كان هناك طلب للذهاب للسلة مباشرة
                if (localStorage.getItem('gotoCart') === 'true') {
                    localStorage.removeItem('gotoCart');
                    showPage('cart');
                }
            }, 2000);
        };

        // 3. نقل إلى صفحة المنتج
        function viewProduct(id) {
            localStorage.setItem('currentProductId', id);
            window.location.href = 'product.html';
        }

        // 4. عرض المنتجات
        function renderProducts(items) {
            const grid = document.getElementById('products-grid');
            if(items.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5"><p>لا توجد منتجات حالياً في المعرض.</p></div>';
                return;
            }

            grid.innerHTML = items.map(p => {
                // التحقق إذا المنتج في السلة
                const inCart = cart.find(item => item.id === p.id);
                const qtyInCart = inCart ? inCart.qty : 0;
                
                return `
                <div class="col-6 col-md-4 animate__animated animate__fadeIn">
                    <div class="product-card" onclick="viewProduct(${p.id})">
                        <div class="product-img-wrapper">
                            <img src="${p.images[0]}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                            <span class="price-badge">${Number(p.price).toLocaleString()} ريال</span>
                        </div>
                        <div class="p-2 flex-grow-1">
                            <h6 class="fw-bold small mb-1">${p.name}</h6>
                            <p class="text-muted" style="font-size:0.7rem; height:30px; overflow:hidden">${p.desc || 'وصف التراث اليمني الأصيل'}</p>
                            ${qtyInCart > 0 ? 
                                `<small class="text-success"><i class="fas fa-check-circle"></i> في السلة (${qtyInCart})</small>` 
                                : ''}
                        </div>
                        <button class="btn-add-cart" onclick="event.stopPropagation(); addToCart(${p.id})">
                            <i class="fas fa-plus-circle me-1"></i> أضف للسلة
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // 5. نظام السلة
        function addToCart(id) {
            const product = dbProducts.find(p => p.id === id);
            const inCart = cart.find(item => item.id === id);

            if(inCart) {
                inCart.qty++;
            } else {
                cart.push({...product, qty: 1});
            }

            // حفظ السلة في localStorage
            localStorage.setItem('yemen_cart', JSON.stringify(cart));
            
            updateCartBadge();
            
            // تأثير بصري للزر
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> تم الإضافة';
            btn.style.background = 'var(--yemen-red)';
            btn.style.color = 'white';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
                btn.style.color = '';
            }, 1000);
            
            // تحديث عرض المنتجات لإظهار حالة المنتج في السلة
            setTimeout(() => {
                const currentCat = document.querySelector('.category-pill.active');
                if (currentCat.textContent === 'الكل') {
                    renderProducts(dbProducts);
                } else {
                    filterCat(currentCat.textContent, currentCat);
                }
            }, 300);
        }

        function updateCartBadge() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        // 6. إدارة التنقل بين الصفحات
        function showPage(id) {
            document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById('page-' + id).classList.add('active-page');
            document.getElementById('btn-' + id).classList.add('active');

            if(id === 'cart') renderCart();
        }

        // 7. عرض السلة
        function renderCart() {
            const container = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const empty = document.getElementById('cart-empty');

            if(cart.length === 0) {
                container.innerHTML = '';
                summary.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            summary.style.display = 'block';

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += (item.price * item.qty);
                return `
                    <div class="bg-white p-3 rounded-4 shadow-sm mb-3 d-flex align-items-center">
                        <img src="${item.images[0]}" style="width:60px; height:60px; border-radius:12px; object-fit:cover" 
                             onerror="this.src='https://via.placeholder.com/60x60'">
                        <div class="ms-3 flex-grow-1">
                            <h6 class="fw-bold mb-0">${item.name}</h6>
                            <small class="text-danger">${Number(item.price).toLocaleString()} ريال</small>
                            <div class="d-flex align-items-center mt-2">
                                <button class="btn btn-sm btn-light rounded-circle" onclick="changeQty(${index}, -1)">-</button>
                                <span class="mx-3 fw-bold">${item.qty}</span>
                                <button class="btn btn-sm btn-light rounded-circle" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                        </div>
                        <button class="btn text-muted" onclick="removeFromCart(${index})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            }).join('');

            document.getElementById('sum-price').innerText = total.toLocaleString() + ' ريال';
            document.getElementById('final-price').innerText = total.toLocaleString() + ' ريال';
        }

        function changeQty(index, val) {
            cart[index].qty += val;
            if(cart[index].qty < 1) cart.splice(index, 1);
            
            // حفظ السلة في localStorage
            localStorage.setItem('yemen_cart', JSON.stringify(cart));
            
            renderCart();
            updateCartBadge();
            
            // تحديث عرض المنتجات
            setTimeout(() => {
                const currentCat = document.querySelector('.category-pill.active');
                if (currentCat && currentCat.textContent === 'الكل') {
                    renderProducts(dbProducts);
                } else if (currentCat) {
                    filterCat(currentCat.textContent, currentCat);
                }
            }, 300);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            
            // حفظ السلة في localStorage
            localStorage.setItem('yemen_cart', JSON.stringify(cart));
            
            renderCart();
            updateCartBadge();
            
            // تحديث عرض المنتجات
            setTimeout(() => {
                const currentCat = document.querySelector('.category-pill.active');
                if (currentCat && currentCat.textContent === 'الكل') {
                    renderProducts(dbProducts);
                } else if (currentCat) {
                    filterCat(currentCat.textContent, currentCat);
                }
            }, 300);
        }

        // 8. البحث والفلترة
        function toggleSearch() {
            const bar = document.getElementById('search-bar');
            bar.style.display = bar.style.display === 'none' ? 'block' : 'none';
        }

        function searchProducts(query) {
            if(!query.trim()) {
                renderProducts(dbProducts);
                return;
            }
            const filtered = dbProducts.filter(p => 
                p.name.includes(query) || 
                (p.desc && p.desc.includes(query)) ||
                p.cat.includes(query)
            );
            renderProducts(filtered);
        }

        function filterCat(cat, el) {
            document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');

            if(cat === 'الكل') {
                renderProducts(dbProducts);
            } else {
                const filtered = dbProducts.filter(p => p.cat === cat);
                renderProducts(filtered);
            }
        }

        // 9. إرسال الطلب (واتساب)
        function sendOrderWhatsApp() {
            const phone = "967777318938";
            let message = "📦 *طلب جديد من متجر تراث اليمن*\n\n";
            
            cart.forEach(item => {
                message += `• ${item.name} (${item.qty} حبة) = ${item.price * item.qty} ريال\n`;
            });

            const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            message += `\n💰 *الإجمالي النهائي: ${total} ريال*\n`;
            message += "\nيرجى التواصل لتأكيد العنوان والتوصيل.";

            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
