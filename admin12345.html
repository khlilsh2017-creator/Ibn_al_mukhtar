<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تراث اليمن - نظام الحفظ السريع المطور</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --yemen-red: #8B0000;
            --honey-gold: #D4AF37;
            --dark-coffee: #2C1810;
        }
        
        body { font-family: 'Tajawal', sans-serif; background-color: #f8f9fa; margin: 0; }

        .wrapper { display: flex; min-height: 100vh; }
        
        #sidebar {
            width: 280px;
            background: var(--dark-coffee);
            position: fixed;
            right: 0;
            height: 100vh;
            color: white;
            z-index: 1000;
            transition: 0.3s;
        }

        .main-content {
            margin-right: 280px;
            width: calc(100% - 280px);
            padding: 30px;
            transition: 0.3s;
        }

        .upload-area {
            border: 3px dashed var(--honey-gold);
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover { background: #fffcf5; border-color: var(--yemen-red); }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .preview-box {
            height: 100px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        .preview-box img { width: 100%; height: 100%; object-fit: cover; }

        .delete-btn {
            position: absolute;
            top: 5px;
            left: 5px;
            background: var(--yemen-red);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @media (max-width: 992px) {
            #sidebar { right: -280px; }
            #sidebar.active { right: 0; }
            .main-content { margin-right: 0; width: 100%; }
            .mobile-toggle { display: block !important; }
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1100;
            background: var(--yemen-red);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <button class="mobile-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <div id="loading" class="loader-overlay">
        <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;"></div>
        <h4 id="loader-text">جاري معالجة الصور...</h4>
    </div>

    <div class="wrapper">
        <nav id="sidebar">
            <div class="p-4 text-center border-bottom border-secondary">
                <h4 class="fw-bold m-0">لوحة الإدارة</h4>
                <small class="text-warning">تراث اليمن الرقمي</small>
            </div>
            <div class="p-3">
                <button class="btn btn-outline-light w-100 mb-3 py-2" onclick="show('dash')">
                    <i class="fas fa-chart-line me-2"></i> الإحصائيات
                </button>
                <button class="btn btn-danger w-100 mb-3 py-2 fw-bold" onclick="show('add')">
                    <i class="fas fa-plus me-2"></i> إضافة منتج
                </button>
                <button class="btn btn-outline-light w-100 py-2" onclick="show('list')">
                    <i class="fas fa-list me-2"></i> عرض المنتجات
                </button>
            </div>
        </nav>

        <main class="main-content">
            <section id="sec-dash">
                <div class="card bg-dark text-white p-5 rounded-4 text-center border-0 shadow">
                    <i class="fas fa-landmark fa-3x mb-3 text-warning"></i>
                    <h1 class="fw-black">تُراث اليَمن</h1>
                    <p class="lead">نظام الإدارة والحفظ السحابي المحلي</p>
                    <div class="display-1 fw-bold text-warning my-3" id="total">0</div>
                    <p class="m-0">منتج مسجل في قاعدة البيانات</p>
                </div>
            </section>

            <section id="sec-add" style="display:none">
                <h2 class="fw-bold mb-4">إضافة منتج جديد</h2>
                <div class="card p-4 shadow-sm border-0 rounded-4">
                    <form id="productForm">
                        <div class="row">
                            <div class="col-md-7">
                                <label class="form-label fw-bold">اسم المنتج</label>
                                <input type="text" id="name" class="form-control mb-3 p-2" required placeholder="مثال: عسل سدر ملكي">
                                
                                <div class="row">
                                    <div class="col-6">
                                        <label class="form-label fw-bold">السعر</label>
                                        <input type="number" id="price" class="form-control mb-3 p-2" required>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label fw-bold">القسم</label>
                                        <select id="cat" class="form-select mb-3 p-2">
                                            <option value="عسل">عسل</option>
                                            <option value="جنابي">جنابي</option>
                                            <option value="بن">بن</option>
                                            <option value="بخور">بخور وعطور</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-5 text-center">
                                <label class="form-label fw-bold">صور المنتج</label>
                                <div class="upload-area" onclick="document.getElementById('fileInp').click()">
                                    <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-2"></i>
                                    <p class="m-0 small fw-bold">اضغط لاختيار الصور من المعرض</p>
                                    <input type="file" id="fileInp" hidden multiple accept="image/*" onchange="processImages(this.files)">
                                </div>
                                <div id="previews" class="preview-grid"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 mt-4 py-3 fw-bold rounded-3 shadow">
                            <i class="fas fa-save me-2"></i> حفظ المنتج ونشره
                        </button>
                    </form>
                </div>
            </section>

            <section id="sec-list" style="display:none">
                <h3 class="fw-bold mb-4">المنتجات المسجلة</h3>
                <div class="table-responsive bg-white p-3 rounded-4 shadow-sm">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>الصورة</th>
                                <th>الاسم</th>
                                <th>القسم</th>
                                <th>الصور</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('yemen_v3_data')) || [];
        let readyImages = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function show(id) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.getElementById('sec-' + id).style.display = 'block';
            if(window.innerWidth <= 992) toggleSidebar();
            if(id === 'list') renderList();
            updateTotal();
        }

        // --- محرك ضغط الصور ---
        async function processImages(files) {
            if(!files.length) return;
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loader-text').innerText = "جاري ضغط ومعالجة الصور...";

            for (let file of files) {
                try {
                    const compressed = await compressImage(file);
                    readyImages.push(compressed);
                    renderPreview(compressed);
                } catch (err) {
                    console.error("خطأ في معالجة الصورة:", err);
                }
            }
            document.getElementById('loading').style.display = 'none';
        }

        function renderPreview(src) {
            const previewGrid = document.getElementById('previews');
            const box = document.createElement('div');
            box.className = 'preview-box animate__animated animate__fadeIn';
            box.innerHTML = `
                <img src="${src}">
                <button type="button" class="delete-btn" onclick="removeImg(this, '${src}')">×</button>
            `;
            previewGrid.appendChild(box);
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onerror = reject;
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; 
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        // ضغط لـ 60% لتقليل الوزن
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        window.removeImg = function(btn, src) {
            readyImages = readyImages.filter(i => i !== src);
            btn.parentElement.remove();
        }

        // الحفظ
        document.getElementById('productForm').onsubmit = function(e) {
            e.preventDefault();
            if(!readyImages.length) return alert('يرجى رفع صورة واحدة على الأقل');
            
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loader-text').innerText = "جاري الحفظ في قاعدة البيانات...";

            setTimeout(() => {
                const product = {
                    id: Date.now(),
                    name: document.getElementById('name').value,
                    price: document.getElementById('price').value,
                    cat: document.getElementById('cat').value,
                    images: [...readyImages]
                };

                try {
                    db.push(product);
                    localStorage.setItem('yemen_v3_data', JSON.stringify(db));
                    alert('تم الحفظ بنجاح!');
                    readyImages = [];
                    location.reload();
                } catch (err) {
                    alert('فشل الحفظ: المساحة ممتلئة! يرجى حذف منتجات قديمة.');
                    document.getElementById('loading').style.display = 'none';
                }
            }, 500);
        };

        function renderList() {
            const body = document.getElementById('tableBody');
            if(db.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="text-center py-4">لا توجد منتجات مسجلة</td></tr>';
                return;
            }

            body.innerHTML = db.map(p => `
                <tr>
                    <td><img src="${p.images[0]}" width="60" height="60" style="object-fit:cover; border-radius:8px; border:1px solid #eee"></td>
                    <td class="fw-bold">${p.name}</td>
                    <td><span class="badge bg-secondary">${p.cat}</span></td>
                    <td><span class="badge bg-info text-dark">${p.images.length} صور</span></td>
                    <td>
                        <button class="btn btn-sm btn-danger rounded-pill px-3" onclick="del(${p.id})">
                            <i class="fas fa-trash me-1"></i> حذف
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        window.del = function(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                db = db.filter(p => p.id !== id);
                localStorage.setItem('yemen_v3_data', JSON.stringify(db));
                renderList();
                updateTotal();
            }
        }

        function updateTotal() {
            document.getElementById('total').innerText = db.length;
        }

        // تهيئة الإحصائيات عند الفتح
        updateTotal();
    </script>
</body>
</html>
